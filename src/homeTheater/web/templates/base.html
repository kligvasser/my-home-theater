<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}my-home-theater{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ static_v }}" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🎬 my-home-theater</a>
    <nav>
      <a href="/" class="{{ 'active' if active == 'dashboard' }}"{{ ' aria-current="page"' if active == 'dashboard' else '' }}>Dashboard</a>
      <a href="/library" class="{{ 'active' if active == 'library' }}"{{ ' aria-current="page"' if active == 'library' else '' }}>Library</a>
      <a href="/candidates" class="{{ 'active' if active == 'candidates' }}"{{ ' aria-current="page"' if active == 'candidates' else '' }}>Candidates</a>
      <a href="/activity" class="{{ 'active' if active == 'activity' }}"{{ ' aria-current="page"' if active == 'activity' else '' }}>Activity</a>
      <a href="/subtitles" class="{{ 'active' if active == 'subtitles' }}"{{ ' aria-current="page"' if active == 'subtitles' else '' }}>Subtitles</a>
      <a href="/insights" class="{{ 'active' if active == 'insights' }}"{{ ' aria-current="page"' if active == 'insights' else '' }}>Insights</a>
      <a href="/gaps" class="{{ 'active' if active == 'gaps' }}"{{ ' aria-current="page"' if active == 'gaps' else '' }}>Gaps</a>
      <a href="/settings" class="{{ 'active' if active == 'settings' }}"{{ ' aria-current="page"' if active == 'settings' else '' }}>Settings</a>
      <a href="/runs" class="{{ 'active' if active == 'runs' }}"{{ ' aria-current="page"' if active == 'runs' else '' }}>Runs</a>
      <a href="/status" class="{{ 'active' if active == 'status' }}"{{ ' aria-current="page"' if active == 'status' else '' }}>Status</a>
    </nav>
    <button id="lock" class="lockbtn" data-action="lock" type="button" aria-label="Unlock write actions">🔒</button>
  </header>
  <div id="flash" class="flash" role="alert" aria-live="polite" hidden></div>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">dashboard · v{{ version }}</footer>
  <script src="/static/app.js?v={{ static_v }}" defer></script>
</body>
</html>
